# Déploiement sur le Data Center de l'AER : application + base PostgreSQL + reverse proxy HTTPS.
# Avant le premier lancement : créer .streamlit/secrets.toml (comptes, [database] url) et le fichier .env
services:
  base:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aer
      POSTGRES_USER: aer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on: [base]
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploiement/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  pgdata:
  caddy_data:
