# Modèle de secrets — copier vers .streamlit/secrets.toml (jamais publié : voir .gitignore)
# ou coller dans Streamlit Cloud : Manage app → Settings → Secrets.

# --- Comptes (empreintes générées par : python scripts/generer_mot_de_passe.py)
[auth.users.admin]
nom = "Prénom NOM"
role = "admin"                       # admin | direction | drh | sdmse | lecteur
password_hash = "pbkdf2_sha256$310000$..."

